[project]
name = "fedproc-ledger"
version = "0.1.0"
description = "Clause incorporation status extraction for US federal solicitations: a verified clause ledger per solicitation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Akteruzzaman Raihan Sikder" }]
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "tenacity>=8.2",
  "pandas>=2.2",
  "pyarrow>=16",
  "numpy>=1.26",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
]

[project.optional-dependencies]
# Phase 8: model training and evaluation (mlflow is required by plan section 12.2)
ml = ["torch>=2.4", "transformers>=4.48", "datasets>=2.20", "accelerate>=0.33", "mlflow>=2.14"]
# Phase 8: ONNX export and int8 quantisation
export = ["optimum[onnxruntime]>=1.21", "onnxruntime>=1.18"]
# Phase 5: annotation tool
annotate = ["streamlit>=1.36"]
# Phase 7 / 8: API baselines and silver labels (vllm is installed separately, Linux only)
llm = ["anthropic>=0.40"]
# Phase 11: local sidecar (plan section 15; FastAPI is named there)
serve = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7", "pandas-stubs", "types-requests"]

[project.scripts]
fl = "fedproc_ledger.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fedproc_ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # fixtures hold literal HTML/XML lines
"src/fedproc_ledger/extract/report.py" = ["E501"]  # HTML templates
"src/fedproc_ledger/rules/commands.py" = ["E501"]  # HTML templates
"scripts/checkpoint_summary.py" = ["E501"]  # report text
"scripts/select_pilot.py" = ["E501"]
"src/fedproc_ledger/label/commands.py" = ["E501"]
"src/fedproc_ledger/label/panel.py" = ["E501"]  # prompt text

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fedproc_ledger.extract.*"]
disallow_untyped_calls = false  # PyMuPDF ships no complete type information
